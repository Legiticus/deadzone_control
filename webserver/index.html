<!DOCTYPE html>
<html>

<head>
	<title>DeadZone - Beta</title>
	<link rel="stylesheet" href="styles/main.css">
	<link rel="icon" href="favicon.jpg" type="image/jpg">
</head>

<body>
	<header>
		<h1>DeadZone - Beta</h1>
	</header>
	<main>
		<section id="towerdisplay">
			<h2>Tower Map:</h2>
			<div id="towermap"></div>
		</section>
		<section id="console">
			<h2>Console:</h2>
		</section>
	</main>
	<footer>
		<button type="button" id="updateallbutton">Update All</button>
		<button type="button" class="updatecolorall" id="red">Set All Red</button>
		<button type="button" class="updatecolorall" id="green">Set All Green</button>
		<button type="button" class="updatecolorall" id="blue">Set All Blue</button>
		<button type="button" class="updatecolorall" id="orange">Set All Lamp</button>
		<button type="button" class="updatecolorall" id="purple">Set All Purple</button>
		<button type="button" class="updatecolorall" id="none">Set All None</button>
	</footer>
	<!--Scripts-->
	<script src="scripts/main.js" type="module"></script>
</body>

</html>
